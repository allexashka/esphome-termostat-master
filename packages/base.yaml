substitutions:
  project_branch: master
  project_version: 2025-master
  
  # Ваш репозиторий (только ets и rka_api)
  project_source: github://allexashka/esphome-termostat-master@$project_branch
  project_source_refresh: 600s
  
  # Репозиторий dentra (только vport и базовые утилиты)
  vport_version: "master"
  vport_source: github://dentra/esphome-components@$vport_version
  vport_source_refresh: 1d
  
  node_name: "#"
  friendly_name: $node_name
  node_add_mac_suffix: "false"

esphome:
  name: $node_name
  friendly_name: $friendly_name
  name_add_mac_suffix: $node_add_mac_suffix
  comment: https://t.me/dentra_blog
  project:
    name: "dentra.ewh-$framework_type-$board"
    version: "$project_version"
  min_version: "2024.12.4"

preferences:
  flash_write_interval: 10min

wifi:
  ap:

captive_portal:

ota:
  - platform: esphome

logger:
  baud_rate: 0

external_components:
  # 1. Базовые компоненты от dentra (vport обязателен для работы ets)
  - source: $vport_source
    components: [crash_info, etl, otax, vport]
    refresh: $vport_source_refresh

  # 2. Ваши модифицированные компоненты (rka_api и ets)
  # vport здесь НЕ указываем, он уже загружен выше
  - source: $project_source
    components: [rka_api, ets]
    refresh: $project_source_refresh